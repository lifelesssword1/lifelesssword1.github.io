<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SGD Studios Games</title>
<meta name="description" content="All games by SGD Studios. Tap a game to get it on your phone.">
<meta property="og:title" content="SGD Studios Games">
<meta property="og:description" content="Fun, free mobile games. Tap to play.">
<meta property="og:image" content="https://lifelesssword1.github.io/fairslice/share.jpg">
<link rel="icon" href="fairslice/icon.png">
<style>
:root{--bg:#FFF0F4;--card:#fff;--fg:#3A1F2B;--muted:#7D6270;--accent:#E8386E;--ink:#fff;--line:#F3D3DE}
@media (prefers-color-scheme:dark){:root{--bg:#1E1418;--card:#2A1C22;--fg:#F8E9EF;--muted:#C2A3B1;--accent:#FF5C8D;--ink:#1E1418;--line:#45303A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:32px max(16px,env(safe-area-inset-left)) 32px max(16px,env(safe-area-inset-right))}
main{max-width:460px;margin:0 auto;display:grid;gap:16px}
header{text-align:center;display:grid;gap:4px;margin-bottom:8px}
h1{margin:0;font-size:28px;color:var(--accent)}
header p{margin:0;color:var(--muted)}
.game{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-decoration:none;color:inherit}
.game img{width:72px;height:72px;border-radius:18px;flex:none}
.game div{min-width:0;flex:1}
.game b{display:block;font-size:18px}
.game span{display:block;color:var(--muted);font-size:14px}
.go{flex:none;background:var(--accent);color:var(--ink);font-weight:800;padding:10px 16px;border-radius:999px}
.soon{opacity:.6}
footer{text-align:center;font-size:13px;color:var(--muted);margin-top:16px}
footer a{color:var(--muted)}
</style></head><body><main>
<header><h1>SGD Studios</h1><p>Free mobile games. Tap a game to get it.</p></header>
<!-- Add each new game here: copy one <a> block, change the folder name, icon and text. -->
<a class="game" href="fairslice/"><img src="fairslice/icon.png" alt=""><div><b>Fair Slice: Cutting Chef</b><span>Slice food to the exact %</span></div><span class="go">Play</span></a>
<footer><a href="privacy/">Privacy policy</a> · <a href="terms/">Terms of use</a></footer>
</main></body></html>
